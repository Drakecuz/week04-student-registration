<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student</title>
    <link rel="preload" as="style" href="http://localhost:8000/build/assets/app-0QkanKKa.css" /><link rel="modulepreload" as="script" href="http://localhost:8000/build/assets/app-DUr89oQr.js" /><link rel="stylesheet" href="http://localhost:8000/build/assets/app-0QkanKKa.css" /><script type="module" src="http://localhost:8000/build/assets/app-DUr89oQr.js"></script></head>
<body class="bg-gray-100 font-sans antialiased">

    
    <nav class="bg-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="http://localhost:8000/register" class="text-xl font-bold text-blue-600">
                🎓 Student Registration
            </a>
            <div class="text-sm text-gray-500">
                ITST 302 — Week 4
            </div>
        </div>
    </nav>

    
    <div class="max-w-5xl mx-auto px-4 mt-4">
        
        
            </div>

    
    <main class="max-w-5xl mx-auto px-4 py-6">
        
<div class="bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Student Registration Form</h1>
    <p class="text-gray-500 mb-6">Fill in all required fields (<span class="text-red-500">*</span>) to register a new student.</p>

    <form action="http://localhost:8000/register" method="POST" enctype="multipart/form-data" class="space-y-6">
        <input type="hidden" name="_token" value="Rzora8kBnXsyKqNMSM1M8rf0b8DAbYp0DmQF02li" autocomplete="off">
        
        <div>
            <label for="student_id" class="block text-sm font-medium text-gray-700 mb-1">
                Student ID <span class="text-red-500">*</span>
            </label>
            <input type="text" name="student_id" id="student_id" value=""
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 "
                   placeholder="e.g. 2024-0001">
                    </div>

        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <input type="text" name="first_name" id="first_name" value=""
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 "
                           placeholder="First Name">
                                    </div>
                <div>
                    <input type="text" name="middle_name" id="middle_name" value=""
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                           placeholder="Middle Name (optional)">
                </div>
                <div>
                    <input type="text" name="last_name" id="last_name" value=""
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 "
                           placeholder="Last Name">
                                    </div>
            </div>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    Email Address <span class="text-red-500">*</span>
                </label>
                <input type="email" name="email" id="email" value=""
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 "
                       placeholder="student@example.com">
                            </div>
            <div>
                <label for="mobile_number" class="block text-sm font-medium text-gray-700 mb-1">
                    Mobile Number <span class="text-red-500">*</span>
                </label>
                <input type="text" name="mobile_number" id="mobile_number" value=""
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 "
                       placeholder="09171234567">
                            </div>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="date_of_birth" class="block text-sm font-medium text-gray-700 mb-1">
                    Date of Birth <span class="text-red-500">*</span>
                </label>
                <input type="date" name="date_of_birth" id="date_of_birth" value=""
                       class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ">
                            </div>
            <div>
                <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">
                    Gender <span class="text-red-500">*</span>
                </label>
                <select name="gender" id="gender"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ">
                    <option value="">Select Gender</option>
                    <option value="Male" >Male</option>
                    <option value="Female" >Female</option>
                    <option value="Other" >Other</option>
                </select>
                            </div>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="program" class="block text-sm font-medium text-gray-700 mb-1">
                    Program <span class="text-red-500">*</span>
                </label>
                <select name="program" id="program"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ">
                    <option value="">Select Program</option>
                    <option value="BSIT" >BSIT</option>
                    <option value="BSCS" >BSCS</option>
                    <option value="BSIS" >BSIS</option>
                    <option value="BSEMC" >BSEMC</option>
                    <option value="BSDA" >BSDA</option>
                </select>
                            </div>
            <div>
                <label for="year_level" class="block text-sm font-medium text-gray-700 mb-1">
                    Year Level <span class="text-red-500">*</span>
                </label>
                <select name="year_level" id="year_level"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ">
                    <option value="">Select Year Level</option>
                    <option value="1st Year" >1st Year</option>
                    <option value="2nd Year" >2nd Year</option>
                    <option value="3rd Year" >3rd Year</option>
                    <option value="4th Year" >4th Year</option>
                </select>
                            </div>
        </div>

        
        <div>
            <label for="address" class="block text-sm font-medium text-gray-700 mb-1">
                Address <span class="text-red-500">*</span>
            </label>
            <textarea name="address" id="address" rows="3"
                      class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 "
                      placeholder="Complete address"></textarea>
                    </div>

        
        <div>
            <label for="profile_picture" class="block text-sm font-medium text-gray-700 mb-1">
                Profile Picture <span class="text-red-500">*</span>
            </label>
            <input type="file" name="profile_picture" id="profile_picture" accept="image/jpeg,image/png,image/jpg"
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ">
            <p class="text-gray-400 text-xs mt-1">Accepted: JPG, JPEG, PNG only. Max 2MB.</p>
                    </div>

        
        <div class="flex items-center gap-4 pt-4 border-t">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-lg transition duration-200">
                ✅ Register Student
            </button>
            <button type="reset"
                    class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-6 py-3 rounded-lg transition duration-200">
                Clear Form
            </button>
        </div>
    </form>
</div>

    </main>

    
    <footer class="text-center text-gray-400 text-sm py-6 border-t mt-8">
        ITST 302 – Client-Server Technologies &bull; Week 4 Laboratory Activity
    </footer>

</body>
</html>
